<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Abs Timer</title>
  <!-- Home-screen / PWA-ish behavior -->
  <meta name="theme-color" content="#0F1520" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Abs Timer" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231D4ED8'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%F0%9F%92%AA%3C/text%3E%3C/svg%3E" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Firebase (optional — the app runs localStorage-only if these fail to load) -->
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0F1520; }
    #root { min-height: 100vh; }
    @keyframes app-pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <!--
    The app is plain <script> files compiled in the browser by Babel Standalone —
    there is no build step, so these are classic scripts sharing one global
    scope, not ES modules. Babel runs them in the order they appear here, and
    that order is the dependency order: data, then logic, then UI, then pages.
    Because Babel fetches each src over XHR, the page must be served over HTTP
    (a static server is enough); opening the file directly no longer works.
  -->
  <script type="text/babel" data-presets="react" src="src/data/library.js"></script>
  <script type="text/babel" data-presets="react" src="src/data/gym-exercises.js"></script>

  <script type="text/babel" data-presets="react" src="src/lib/schedule.js"></script>
  <script type="text/babel" data-presets="react" src="src/lib/audio.js"></script>
  <script type="text/babel" data-presets="react" src="src/lib/platform.js"></script>
  <script type="text/babel" data-presets="react" src="src/lib/search.js"></script>
  <script type="text/babel" data-presets="react" src="src/lib/store.js"></script>

  <script type="text/babel" data-presets="react" src="src/ui/styles.js"></script>
  <script type="text/babel" data-presets="react" src="src/ui/components.js"></script>

  <script type="text/babel" data-presets="react" src="src/pages/abs-timer.js"></script>
  <script type="text/babel" data-presets="react" src="src/pages/gym-tracker.js"></script>
  <script type="text/babel" data-presets="react" src="src/pages/home.js"></script>
  <script type="text/babel" data-presets="react" src="src/main.js"></script>
</body>
</html>
